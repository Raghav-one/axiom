<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axiom Perspective — A Critic's Operating System for AI</title>
<meta name="description" content="A field manual for thinking clearly about AI, built from the positions, disagreements and blind spots of the people deciding its direction.">
<style>
/* REVOLUTION — light editorial. Built to be read at length, not skimmed. */
:root{
  --bg:#ffffff; --bg-2:#ffffff; --bg-3:#f7f7f6; --bg-card:#ffffff;
  --ink:#16181d; --ink-2:#4a4f5a; --ink-3:#7c828e;
  --line:#e3e1dc; --line-2:#cfcdc7;
  --hot:#c2410c; --cool:#1d4ed8; --grn:#0f7a52; --pur:#7c3aed; --red:#be123c; --amb:#a16207;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
  --maxw:940px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16.5px;line-height:1.68;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 520px at 12% -8%,rgba(29,78,216,.055),transparent 60%),
    radial-gradient(760px 460px at 92% 4%,rgba(124,58,237,.045),transparent 62%),
    radial-gradient(700px 500px at 50% 108%,rgba(194,65,12,.04),transparent 60%);
}
#app{position:relative;z-index:1}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.nav{
  width:266px;flex:0 0 266px;height:100vh;position:sticky;top:0;
  border-right:1px solid var(--line);background:rgba(251,250,248,.88);
  backdrop-filter:blur(14px);overflow-y:auto;padding:26px 0 40px;
}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.brand{padding:0 22px 20px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand-mark{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.34em;color:var(--hot);
  text-transform:uppercase;margin-bottom:9px;
}
.brand-name{
  font-family:var(--serif);font-size:1.72rem;line-height:1.05;letter-spacing:-.02em;
  font-weight:600;margin-bottom:7px;
}
.brand-sub{font-size:.73rem;color:var(--ink-3);line-height:1.5}
.nav-sec{padding:0 14px;margin-bottom:22px}
.nav-h{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);padding:0 8px;margin-bottom:8px;
}
.nav a{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;
  color:var(--ink-2);text-decoration:none;font-size:.845rem;transition:.15s;
  border-left:2px solid transparent;
}
.nav a:hover{background:var(--bg-3);color:var(--ink)}
.nav a.on{background:rgba(29,78,216,.07);color:var(--ink);border-left-color:var(--cool)}
.nav a .gl{font-size:.8rem;opacity:.85;width:14px;text-align:center;flex:0 0 14px}
.nav a .nn{font-family:var(--mono);font-size:.66rem;color:var(--ink-3);flex:0 0 20px}

.main{flex:1;min-width:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:70px 44px 130px}

/* ---------- hero ---------- */
.hero{
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:80px 44px;max-width:1040px;margin:0 auto;position:relative;
}
.hero-tag{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--hot);margin-bottom:26px;
}
.hero h1{
  font-family:var(--serif);font-size:clamp(3.2rem,8.5vw,6.6rem);line-height:.94;
  letter-spacing:-.035em;font-weight:600;margin:0 0 8px;
}
.hero h1 em{
  font-style:italic;
  background:linear-gradient(100deg,#c2410c,#7c3aed 55%,#1d4ed8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-lede{
  font-family:var(--serif);font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.5;
  color:var(--ink-2);max-width:660px;margin:26px 0 0;
}
.hero-lede strong{color:var(--ink);font-weight:600}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:26px;margin-top:52px;padding-top:26px;
  border-top:1px solid var(--line);
}
.hm{min-width:104px}
.hm-n{font-family:var(--serif);font-size:1.95rem;line-height:1;color:var(--ink)}
.hm-l{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}
.hero-note{
  margin-top:44px;padding:18px 22px;border-left:2px solid var(--line-2);
  font-size:.87rem;color:var(--ink-3);max-width:620px;line-height:1.6;
}

/* ---------- section furniture ---------- */
.part-head{margin-bottom:52px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.part-n{
  font-family:var(--mono);font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--hot);margin-bottom:14px;
}
.part-head h2{
  font-family:var(--serif);font-size:clamp(2.1rem,4.6vw,3.1rem);line-height:1.06;
  letter-spacing:-.025em;font-weight:600;margin:0 0 16px;
}
.part-head p{color:var(--ink-2);font-size:1.02rem;max-width:680px;margin:0}

h3{font-family:var(--serif);font-size:1.52rem;line-height:1.22;letter-spacing:-.015em;font-weight:600;margin:0 0 12px}
p{margin:0 0 15px}
em{color:var(--ink)}
strong{color:var(--ink);font-weight:600}

/* ---------- mind cards ---------- */
.mind{
  border:1px solid var(--line);border-radius:14px;background:var(--bg-card);
  margin-bottom:22px;overflow:hidden;transition:border-color .2s,box-shadow .2s;
  box-shadow:0 1px 2px rgba(22,24,29,.04),0 8px 24px -18px rgba(22,24,29,.18);
}
.mind:hover{border-color:var(--line-2);box-shadow:0 1px 2px rgba(22,24,29,.05),0 12px 30px -18px rgba(22,24,29,.26)}
.mind-top{
  display:flex;align-items:flex-start;gap:16px;padding:24px 26px;cursor:pointer;
  position:relative;
}
.mind-top::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mc);
}
.mind-glyph{
  font-size:1.5rem;color:var(--mc);line-height:1;margin-top:3px;flex:0 0 auto;
}
.mind-id{flex:1;min-width:0}
.mind-name{font-family:var(--serif);font-size:1.44rem;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.mind-role{font-size:.78rem;color:var(--ink-3);margin-top:3px}
.mind-arch{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mc);margin-top:9px;
}
.mind-x{color:var(--ink-3);font-size:1.1rem;flex:0 0 auto;transition:transform .22s;margin-top:6px}
.mind.open .mind-x{transform:rotate(45deg)}
.mind-thesis{
  padding:0 26px 22px;font-family:var(--serif);font-size:1.06rem;line-height:1.56;
  color:var(--ink-2);border-bottom:1px solid var(--line);
}
.mind-body{display:none;padding:24px 26px 26px}
.mind.open .mind-body{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.stake{
  background:var(--bg-3);border-radius:9px;padding:15px 17px;margin-bottom:22px;
  font-size:.88rem;color:var(--ink-2);border-left:2px solid var(--mc);
}
.stake b{
  display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mc);margin-bottom:7px;
}
.core-item{margin-bottom:17px;padding-left:15px;border-left:1px solid var(--line-2)}
.core-item b{display:block;color:var(--ink);font-size:.95rem;margin-bottom:5px}
.core-item span{font-size:.91rem;color:var(--ink-2)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.jc{border:1px solid var(--line);border-radius:10px;padding:15px 17px;background:var(--bg-2)}
.jc b{
  display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:8px;
}
.jc.w b{color:var(--red)} .jc.b b{color:var(--amb)}
.jc span{font-size:.86rem;color:var(--ink-2)}
.test{
  margin-top:14px;border:1px solid rgba(15,122,82,.28);background:rgba(15,122,82,.055);
  border-radius:10px;padding:15px 17px;
}
.test b{
  display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--grn);margin-bottom:8px;
}
.test span{font-size:.86rem;color:var(--ink-2)}

/* ---------- fault lines ---------- */
.fl{border:1px solid var(--line);border-radius:14px;background:var(--bg-card);margin-bottom:26px;overflow:hidden;box-shadow:0 1px 2px rgba(22,24,29,.04),0 8px 24px -18px rgba(22,24,29,.16)}
.fl-h{padding:24px 26px 20px;border-bottom:1px solid var(--line)}
.fl-n{font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;color:var(--hot);margin-bottom:10px}
.fl-h h3{margin-bottom:10px}
.fl-stake{font-size:.89rem;color:var(--ink-3)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:0}
.side{padding:22px 26px}
.side:first-child{border-right:1px solid var(--line)}
.side-l{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;
}
.side.a .side-l{color:var(--cool)} .side.b .side-l{color:var(--hot)}
.side-who{font-size:.76rem;color:var(--ink-3);margin-bottom:13px;font-style:italic}
.side-claim{font-size:.9rem;color:var(--ink-2);margin-bottom:13px}
.side-ev{
  font-size:.81rem;color:var(--ink-3);padding-top:11px;border-top:1px dashed var(--line-2);
}
.side-ev b{font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:5px}
.fl-res{padding:20px 26px;background:rgba(15,122,82,.05);border-top:1px solid var(--line)}
.fl-res b,.fl-crit b{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
  display:block;margin-bottom:8px;
}
.fl-res b{color:var(--grn)} .fl-crit b{color:var(--pur)}
.fl-res span,.fl-crit span{font-size:.89rem;color:var(--ink-2)}
.fl-crit{padding:20px 26px;background:rgba(124,58,237,.05);border-top:1px solid var(--line)}

/* ---------- concepts ---------- */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:30px}
.filters button{
  font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 13px;border-radius:20px;border:1px solid var(--line-2);
  background:transparent;color:var(--ink-3);cursor:pointer;transition:.15s;
}
.filters button:hover{color:var(--ink);border-color:var(--ink-3)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cpt{border:1px solid var(--line);border-radius:14px;background:var(--bg-card);padding:26px 28px;margin-bottom:20px;box-shadow:0 1px 2px rgba(22,24,29,.04),0 8px 24px -18px rgba(22,24,29,.16)}
.cpt-top{display:flex;align-items:baseline;gap:13px;margin-bottom:9px;flex-wrap:wrap}
.cpt-n{font-family:var(--mono);font-size:.72rem;color:var(--ink-3)}
.cpt-tag{
  font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-3);
}
.cpt h3{flex-basis:100%;margin:0}
.cpt-origin{font-size:.75rem;color:var(--ink-3);font-style:italic;margin-bottom:15px}
.cpt-one{
  font-family:var(--serif);font-size:1.13rem;line-height:1.5;color:var(--ink);
  padding:15px 18px;background:var(--bg-3);border-radius:9px;border-left:2px solid var(--cool);
  margin-bottom:17px;
}
.cpt-body{font-size:.94rem;color:var(--ink-2);margin-bottom:17px}
.cpt-grid{display:grid;gap:12px}
.cb{border-radius:9px;padding:14px 16px;font-size:.88rem;color:var(--ink-2)}
.cb b{
  font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;
  display:block;margin-bottom:7px;
}
.cb.why{background:var(--bg-3)} .cb.why b{color:var(--ink-3)}
.cb.pred{background:rgba(29,78,216,.055);border:1px solid rgba(29,78,216,.20)} .cb.pred b{color:var(--cool)}
.cb.cav{background:rgba(190,18,60,.045);border:1px solid rgba(190,18,60,.18)} .cb.cav b{color:var(--red)}
.cpt-voices{margin-top:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cpt-voices span{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.vchip{
  font-size:.72rem;padding:3px 10px;border-radius:20px;border:1px solid currentColor;
  opacity:.85;text-decoration:none;
}

/* ---------- toolkit ---------- */
.tool{
  border:1px solid var(--line);border-radius:14px;background:var(--bg-card);
  padding:26px 28px;margin-bottom:18px;position:relative;overflow:hidden;
;box-shadow:0 1px 2px rgba(22,24,29,.04),0 8px 24px -18px rgba(22,24,29,.16)}
.tool::before{
  content:attr(data-n);position:absolute;right:20px;top:6px;
  font-family:var(--serif);font-size:4.2rem;color:var(--line);line-height:1;pointer-events:none;
}
.tool h3{font-size:1.3rem;margin-bottom:12px;max-width:82%}
.tool-move{
  font-family:var(--serif);font-size:1.04rem;color:var(--ink);line-height:1.5;
  padding:14px 17px;background:var(--bg-3);border-left:2px solid var(--hot);
  border-radius:8px;margin-bottom:15px;
}
.tool-detail{font-size:.93rem;color:var(--ink-2);margin-bottom:15px}
.tool-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tp{border-radius:9px;padding:13px 15px;font-size:.86rem;color:var(--ink-2)}
.tp b{font-family:var(--mono);font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:6px}
.tp.tell{background:rgba(161,98,7,.055);border:1px solid rgba(161,98,7,.20)} .tp.tell b{color:var(--amb)}
.tp.inv{background:rgba(15,122,82,.05);border:1px solid rgba(15,122,82,.18)} .tp.inv b{color:var(--grn)}

/* ---------- scorecard ---------- */
.sc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg-card);box-shadow:0 1px 2px rgba(22,24,29,.04),0 8px 24px -18px rgba(22,24,29,.16)}
.sc-row{display:grid;grid-template-columns:104px 1fr 92px;gap:0;border-bottom:1px solid var(--line)}
.sc-row:last-child{border-bottom:none}
.sc-era{
  padding:18px 16px;font-family:var(--mono);font-size:.68rem;color:var(--ink-3);
  border-right:1px solid var(--line);
}
.sc-mid{padding:18px 20px}
.sc-claim{font-size:1rem;color:var(--ink);font-weight:600;margin-bottom:7px}
.sc-why{font-size:.86rem;color:var(--ink-2);margin-bottom:9px}
.sc-lesson{font-size:.84rem;color:var(--ink-3);padding-left:12px;border-left:2px solid var(--line-2)}
.sc-v{padding:18px 12px;border-left:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center}
.vb{
  font-family:var(--mono);font-size:.56rem;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;white-space:nowrap;
}
.vb.died{background:rgba(190,18,60,.10);color:var(--red)}
.vb.stuck{background:rgba(15,122,82,.10);color:var(--grn)}
.vb.partial{background:rgba(161,98,7,.10);color:var(--amb)}
.vb.open{background:rgba(124,58,237,.10);color:var(--pur)}
.vb.emerging{background:rgba(29,78,216,.10);color:var(--cool)}

/* ---------- diagrams ---------- */
.figure{margin:34px 0 40px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);padding:24px 22px 18px;box-shadow:0 1px 2px rgba(22,24,29,.04),0 8px 24px -18px rgba(22,24,29,.16)}
.fig-t{font-family:var(--serif);font-size:1.16rem;color:var(--ink);margin-bottom:5px}
.fig-s{font-size:.83rem;color:var(--ink-3);margin-bottom:20px}
.fig-note{font-size:.82rem;color:var(--ink-3);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dg{width:100%;height:auto;display:block;overflow:visible}
.dg-grid{stroke:var(--line);stroke-width:1}
.dg-axis{stroke:var(--line-2);stroke-width:1}
.dg-ylab{fill:var(--ink-3);font-size:10.5px;font-family:var(--mono);text-anchor:end}
.dg-xlab{fill:var(--ink-3);font-size:10.5px;font-family:var(--mono);text-anchor:middle}
.dg-sub{fill:var(--ink-3);font-size:9.5px;font-family:var(--sans);text-anchor:middle;opacity:.75}
.dg-cap{fill:var(--ink-3);font-size:10.5px;font-family:var(--mono)}
.dg-note{fill:var(--ink-3);font-size:10px;font-family:var(--mono);opacity:.8}
.dg-anno{fill:var(--grn);font-size:11px;font-family:var(--mono)}
.dg-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.dg-proj{fill:none;stroke:var(--ink-3);stroke-width:1.8;stroke-dasharray:6 4;opacity:.85}
.dg-dot{fill:var(--bg);stroke:var(--grn);stroke-width:2}
.dg-future{fill:rgba(22,24,29,.028)}
.dg-bar{fill:var(--hot);fill-opacity:.28;stroke:var(--hot);stroke-opacity:.6}
.dg-barval{fill:var(--ink-2);font-size:11px;font-family:var(--mono);text-anchor:middle}
.dg-ltitle{font-size:13px;font-family:var(--sans);font-weight:600}
.dg-lsub{fill:var(--ink-3);font-size:10.5px;font-family:var(--sans)}
.dg-ltag{font-size:10px;font-family:var(--mono);opacity:.8}
.dg-nname{font-size:11.5px;font-family:var(--mono);text-anchor:middle}
.dg-axlab{fill:var(--ink-3);font-size:10.5px;font-family:var(--mono)}
.dg-vlab{fill:var(--ink-2);font-size:12px;font-family:var(--sans)}
.dg-vtrack{fill:var(--line);fill-opacity:.5}
.dg-vtag{font-size:10px;font-family:var(--mono)}

/* ---------- misc ---------- */
.callout{
  border:1px solid var(--line-2);border-radius:14px;padding:24px 26px;margin:34px 0;
  background:linear-gradient(160deg,rgba(194,65,12,.055),rgba(124,58,237,.04));
}
.callout h3{font-size:1.24rem;margin-bottom:11px}
.callout p{font-size:.95rem;color:var(--ink-2);margin:0}
.closing p{font-family:var(--serif);font-size:1.09rem;line-height:1.66;color:var(--ink-2);margin-bottom:19px}
.sources{margin-top:60px;padding-top:26px;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-3)}
.sources h4{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.sources p{margin-bottom:9px}
.top{
  position:fixed;right:26px;bottom:26px;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line-2);background:var(--bg-3);color:var(--ink-2);
  cursor:pointer;font-size:1rem;display:none;align-items:center;justify-content:center;z-index:50;
}
.top.show{display:flex}
.top:hover{color:var(--ink);border-color:var(--ink-3)}
.navtoggle{
  display:none;position:fixed;left:14px;top:14px;z-index:60;width:40px;height:40px;
  border-radius:9px;border:1px solid var(--line-2);background:rgba(255,255,255,.95);
  color:var(--ink);font-size:1.1rem;cursor:pointer;
}

@media(max-width:1040px){
  .nav{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;z-index:55}
  .nav.open{transform:none}
  .navtoggle{display:block}
  .wrap,.hero{padding-left:22px;padding-right:22px}
  .hero{padding-top:80px}
}
@media(max-width:720px){
  body{font-size:15.5px}
  .sides,.judge,.tool-pair{grid-template-columns:1fr}
  .side:first-child{border-right:none;border-bottom:1px solid var(--line)}
  .sc-row{grid-template-columns:1fr}
  .sc-era{border-right:none;border-bottom:1px solid var(--line);padding-bottom:10px}
  .sc-v{border-left:none;justify-content:flex-start;padding:0 20px 18px}
  .tool::before{display:none}
  .tool h3{max-width:100%}
}

/* adjacent minds */
.adj-field{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);margin:26px 0 9px;padding-left:2px;
}
.lesson{

function taskHorizonChart() {
  // METR doubling curve, log scale on task length.
  const pts = [
    [2019, 2/60], [2020, 5/60], [2021, 10/60], [2022, 20/60],
    [2023, 0.75], [2024, 1.4], [2025, 2.0], [2026, 2.28]
  ];
  const W = 760, H = 380, ml = 66, mr = 130, mt = 30, mb = 46;
  const pw = W - ml - mr, ph = H - mt - mb;
  const x = y => ml + ((y - 2019) / (2032 - 2019)) * pw;
  const lo = Math.log10(1/60), hi = Math.log10(200);
  const yy = v => mt + ph - ((Math.log10(v) - lo) / (hi - lo)) * ph;

  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${yy(p[1]).toFixed(1)}`).join("");
  // projection at 7-month doubling from 2026
  const proj = [];
  for (let m = 0; m <= 72; m += 3) {
    const t = 2026 + m / 12;
    proj.push([t, 2.28 * Math.pow(2, m / 7)]);
  }
  const projPath = proj.filter(p => p[1] < 200).map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${yy(p[1]).toFixed(1)}`).join("");

  const bands = [
    [1/60, "1 min"], [10/60, "10 min"], [1, "1 hr"], [8, "1 work day"], [40, "1 work week"]
  ];
  const gridY = bands.map(b =>
    `<line x1="${ml}" y1="${yy(b[0])}" x2="${ml + pw}" y2="${yy(b[0])}" class="dg-grid"/>
     <text x="${ml - 8}" y="${yy(b[0]) + 4}" class="dg-ylab">${b[1]}</text>`).join("");
  const gridX = [2019, 2022, 2025, 2028, 2031].map(t =>
    `<line x1="${x(t)}" y1="${mt}" x2="${x(t)}" y2="${mt + ph}" class="dg-grid"/>
     <text x="${x(t)}" y="${mt + ph + 20}" class="dg-xlab">${t}</text>`).join("");

  const dots = pts.map(p => `<circle cx="${x(p[0])}" cy="${yy(p[1])}" r="4" class="dg-dot"/>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" class="dg" role="img" aria-label="Task horizon doubling curve from 2019 to 2032">
    <defs><linearGradient id="thg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f7a52"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
    ${gridY}${gridX}
    <rect x="${x(2026)}" y="${mt}" width="${ml + pw - x(2026)}" height="${ph}" class="dg-future"/>
    <text x="${ml + pw - 4}" y="${mt + ph - 8}" class="dg-note" text-anchor="end">projected · 7-month doubling</text>
    <path d="${projPath}" class="dg-proj"/>
    <path d="${path}" class="dg-line" stroke="url(#thg)"/>
    ${dots}
    <text x="${x(2026) + 6}" y="${yy(2.28) - 12}" class="dg-anno">2h17m · 2026</text>
    <text x="${ml}" y="${H - 6}" class="dg-cap">Task length completable at 50% reliability · log scale · METR</text>
  </svg>`;
}

function ninesChart() {
  const W = 760, H = 300, ml = 70, mr = 30, mt = 26, mb = 50;
  const pw = W - ml - mr, ph = H - mt - mb;
  const nines = [1, 2, 3, 4, 5];
  const bw = pw / nines.length * 0.55;
  const bars = nines.map((n, i) => {
    const cx = ml + (i + 0.5) * (pw / nines.length);
    const h = ph * 0.16 * n;
    const label = ["90%", "99%", "99.9%", "99.99%", "99.999%"][i];
    const stage = ["demo", "internal tool", "enterprise", "critical", "safety-critical"][i];
    return `<rect x="${cx - bw / 2}" y="${mt + ph - h}" width="${bw}" height="${h}" class="dg-bar" style="--i:${i}"/>
      <text x="${cx}" y="${mt + ph - h - 9}" class="dg-barval">${label}</text>
      <text x="${cx}" y="${mt + ph + 20}" class="dg-xlab">nine ${n}</text>
      <text x="${cx}" y="${mt + ph + 37}" class="dg-sub">${stage}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="dg" role="img" aria-label="Cumulative effort by reliability nine">
    <line x1="${ml}" y1="${mt + ph}" x2="${ml + pw}" y2="${mt + ph}" class="dg-axis"/>
    <text x="${ml - 10}" y="${mt + 12}" class="dg-ylab" text-anchor="end">effort</text>
    ${bars}
  </svg>`;
}

function spectrumDiagram(minds) {
  // Position each mind on two axes: timeline (x) and scale-sufficiency (y).
  const coords = {
    musk: [0.92, 0.93], huang: [0.78, 0.80], amodei: [0.84, 0.74],
    hassabis: [0.62, 0.55], karpathy: [0.44, 0.62], liang: [0.58, 0.70],
    sutskever: [0.50, 0.22], lecun: [0.24, 0.10], sutton: [0.34, 0.18],
    hinton: [0.72, 0.66], li: [0.40, 0.34], marcus: [0.10, 0.06],
    raschka: [0.46, 0.44],
    keller: [0.70, 0.86], kelley: [0.16, 0.30], tsmc: [0.54, 0.64], ousterhout: [0.28, 0.40],
    scholl: [0.38, 0.76]
  };
  const adjacent = new Set(["keller", "kelley", "tsmc", "ousterhout", "scholl"]);
  const W = 760, H = 500, mL = 78, mR = 34, mT = 54, mB = 62;
  const pw = W - mL - mR, ph = H - mT - mB;
  const nodes = minds.filter(mind => coords[mind.id]).map(mind => {
    const [cx, cy] = coords[mind.id];
    const px = mL + cx * pw, py = mT + (1 - cy) * ph;
    const short = mind.name.split(" ").slice(-1)[0];
    const isAdj = adjacent.has(mind.id);
    return `<g class="dg-node">
      ${isAdj
        ? `<rect x="${px - 6}" y="${py - 6}" width="12" height="12" fill="${mind.color}" fill-opacity="0.75" transform="rotate(45 ${px} ${py})"/>
           <rect x="${px - 13}" y="${py - 13}" width="26" height="26" fill="none" stroke="${mind.color}" stroke-opacity="0.24" stroke-dasharray="3 3" transform="rotate(45 ${px} ${py})"/>`
        : `<circle cx="${px}" cy="${py}" r="7" fill="${mind.color}" fill-opacity="0.85"/>
           <circle cx="${px}" cy="${py}" r="14" fill="none" stroke="${mind.color}" stroke-opacity="0.28"/>`}
      <text x="${px}" y="${py - 21}" class="dg-nname" fill="${mind.color}">${short}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="dg" role="img" aria-label="Positions on timeline and scale-sufficiency">
    <line x1="${mL}" y1="${mT + ph}" x2="${mL + pw}" y2="${mT + ph}" class="dg-axis"/>
    <line x1="${mL}" y1="${mT}" x2="${mL}" y2="${mT + ph}" class="dg-axis"/>
    <line x1="${mL + pw / 2}" y1="${mT}" x2="${mL + pw / 2}" y2="${mT + ph}" class="dg-grid"/>
    <line x1="${mL}" y1="${mT + ph / 2}" x2="${mL + pw}" y2="${mT + ph / 2}" class="dg-grid"/>
    ${nodes}
    <text x="${mL + pw}" y="${mT + ph + 24}" class="dg-axlab" text-anchor="end">sooner →</text>
    <text x="${mL}" y="${mT + ph + 24}" class="dg-axlab">← later</text>
    <text x="${mL - 20}" y="${mT + ph}" class="dg-axlab" text-anchor="start" transform="rotate(-90 ${mL - 20} ${mT + ph})">← something is missing</text>
    <text x="${mL - 20}" y="${mT}" class="dg-axlab" text-anchor="end" transform="rotate(-90 ${mL - 20} ${mT})">scale is sufficient →</text>
    <g transform="translate(${mL},${mT - 26})">
      <circle cx="6" cy="0" r="5" fill="var(--ink-3)" fill-opacity="0.7"/>
      <text x="18" y="4" class="dg-axlab">works on AI</text>
      <rect x="97" y="-5" width="10" height="10" fill="var(--ink-3)" fill-opacity="0.7" transform="rotate(45 102 0)"/>
      <text x="114" y="4" class="dg-axlab">from outside</text>
    </g>
  </svg>`;
}

function agentMathDiagram() {
  const steps = [1, 5, 10, 20, 50];
  const rates = [0.95, 0.99, 0.999];
  const W = 760, H = 250, ml = 90, mt = 40, mb = 50, mr = 40;
  const pw = W - ml - mr, ph = H - mt - mb;
  const colors = ["#be123c", "#a16207", "#0f7a52"];
  const lines = rates.map((r, ri) => {
    const pts = steps.map((s, i) => {
      const px = ml + (i / (steps.length - 1)) * pw;
      const py = mt + ph - Math.pow(r, s) * ph;
      return `${i ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`;
    }).join("");
    const dots = steps.map((s, i) => {
      const px = ml + (i / (steps.length - 1)) * pw;
      const py = mt + ph - Math.pow(r, s) * ph;
      return `<circle cx="${px}" cy="${py}" r="3.5" fill="${colors[ri]}"/>`;
    }).join("");
    const endY = mt + ph - Math.pow(r, 50) * ph;
    return `<path d="${pts}" fill="none" stroke="${colors[ri]}" stroke-width="2"/>${dots}
      <text x="${ml + pw + 8}" y="${endY + 4}" class="dg-vtag" fill="${colors[ri]}">${(r * 100).toFixed(r === 0.999 ? 1 : 0)}%</text>`;
  }).join("");
  const xl = steps.map((s, i) =>
    `<text x="${ml + (i / (steps.length - 1)) * pw}" y="${mt + ph + 22}" class="dg-xlab">${s}</text>`).join("");
  const yl = [0, 50, 100].map(v =>
    `<line x1="${ml}" y1="${mt + ph - v / 100 * ph}" x2="${ml + pw}" y2="${mt + ph - v / 100 * ph}" class="dg-grid"/>
     <text x="${ml - 10}" y="${mt + ph - v / 100 * ph + 4}" class="dg-ylab">${v}%</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="dg" role="img" aria-label="Compounding failure across agent steps">
    ${yl}${lines}${xl}
    <text x="${ml + pw / 2}" y="${H - 8}" class="dg-cap" text-anchor="middle">number of chained steps →</text>
  </svg>`;
}

      <p>Serious people disagree about these six things, and almost everything else is downstream. Each is steelmanned on both sides and given a resolution criterion — the observable that would actually settle it. A disagreement with no such criterion is not a debate; it is a fandom.</p>
    </div>
    ${fig("The number the whole timeline argument rests on", "Task length an AI completes at 50% reliability. Doubling roughly every seven months since 2019.", taskHorizonChart(), "Karpathy's decade and the labs' short timelines are the <em>same disagreement about this one curve</em>: whether it stays straight or bends. Naive extrapolation reaches a full working day around 2028. If you track one number in this entire field, track this one — it is public, unambiguous, and it settles the argument on a schedule.")}
    ${cards}
  </section>`;
}

function partConcepts() {
  const cards = CONCEPTS.map(c => `
    <article class="cpt" data-tag="${c.tag}" id="cpt-${c.id}">
      <div class="cpt-top">
        <span class="cpt-n">${c.n}</span>
        <span class="cpt-tag">${c.tag}</span>
        <h3>${c.title}</h3>
      </div>
      <div class="cpt-origin">${c.origin}</div>
      <div class="cpt-one">${c.oneline}</div>
      <div class="cpt-body">${c.body}</div>
      <div class="cpt-grid">
        <div class="cb why"><b>Why it matters</b>${c.why}</div>
        <div class="cb pred"><b>What it predicts</b>${c.predicts}</div>
        <div class="cb cav"><b>Where it breaks</b>${c.caveat}</div>
      </div>
      <div class="cpt-voices"><span>Argued by</span>${c.voices.map(v => {
        const m = byId[v];
        return m ? `<a class="vchip" href="#mind-${m.id}" style="color:${m.color}">${m.glyph} ${m.name.split(" ").slice(-1)[0]}</a>` : "";
      }).join("")}</div>
    </article>`).join("");

  return `<section class="wrap" id="concepts">
    <div class="part-head">
      <div class="part-n">Part III</div>
      <h2>Concepts That Actually Matter</h2>
      <p>Selected for predictive power, not mechanical completeness. You do not need to know how attention works. You need the fourteen ideas that let you forecast what happens next — each one framed by what it predicts and where it fails.</p>
    </div>
    <div class="filters" id="cpt-filters">
      <button class="on" data-f="all">All ${CONCEPTS.length}</button>
      ${TAGS.map(t => `<button data-f="${t}">${t}</button>`).join("")}
    </div>
    ${cards}
    ${fig("Why progress is shaped the way it is", "Machine-verifiable domains compound. Contested ones crawl. This one property explains the jagged frontier.", verifiabilityDiagram(), "Ask of any job: <em>can a machine check the answer without a human?</em> Code compiles, proofs verify, tests pass. Strategy, taste and research judgment do not. The seam between these two families is where the frontier stays jagged — and it is predictable in advance, which makes it the most useful single question in the toolkit.")}
    ${fig("The march of nines", "Each nine of reliability costs roughly what the last one cost. Demos are exponentially cheaper than products.", ninesChart(), "A 90%-reliable demo is not nine-tenths finished — it may be a tenth of the way through the engineering. This model, applied in 2024, correctly predicted the 2026 agent disappointment.")}
    ${fig("Why agents disappointed", "Reliability compounds multiplicatively across chained steps. This is the arithmetic behind the 2026 cancellations.", agentMathDiagram(), "A 95%-reliable step chained twenty times succeeds 36% of the time. At 99% it is 82%; at 99.9%, 98%. Long-horizon agency does not need a slightly better model — it needs <em>orders of magnitude</em> better per-step reliability. That is the march of nines expressed as multiplication.")}
  </section>`;
}

function partSystems() {
  return `<section class="wrap" id="systems">
    <div class="part-head">
      <div class="part-n">Part IV</div>
      <h2>The Physical Layer</h2>
      <p>Everything above runs on concrete, copper and power. The slowest element in the stack sets the pace for all of it — and it is the element almost nobody in the discourse is watching.</p>
    </div>
    ${fig("The stack, ordered by how slowly it moves", "Read bottom-up for revenue, top-down for constraints. The floor is energy, and energy moves on permitting cycles.", stackDiagram(), "Note the inversion: the layers that move fastest (post-training, inference products) sit on layers that move slowest (grid interconnects, transformers, fabs). A capability breakthrough cannot outrun a substation queue, which is why 2026's binding constraint migrated from chips to power.")}
    <div class="callout">
      <h3>The four numbers to hold</h3>
      <p><strong>$635–690B</strong> — guided 2026 hyperscaler capex, ~75% AI infrastructure, more than double 2024. <strong>156 GW</strong> — projected US datacenter power demand by 2030, from ~50 GW in 2024. <strong>7–10 years</strong> — time to plan and energize a single new high-voltage interconnect. <strong>~7 months</strong> — the task-horizon doubling time. The first three are matters of public record with years of visibility. The fourth is the only genuinely uncertain one — and the whole argument lives there.</p>
    </div>
  </section>`;
}

function partToolkit() {
  const cards = TOOLS.map(t => `
    <article class="tool" data-n="${t.n}">
      <h3>${t.title}</h3>
      <div class="tool-move">${t.move}</div>
      <div class="tool-detail">${t.detail}</div>
      <div class="tool-pair">
        <div class="tp tell"><b>The tell</b>${t.tell}</div>
        <div class="tp inv"><b>Where it misfires</b>${t.inverse}</div>
      </div>
    </article>`).join("");

  return `<section class="wrap" id="toolkit">
    <div class="part-head">
      <div class="part-n">Part V</div>
      <h2>The Critic's Toolkit</h2>
      <p>Ten moves, each applicable without technical expertise, each paired with the failure mode it produces when over-applied. Skepticism that never updates is as useless as credulity — these are calibration instruments, not dismissal devices.</p>
    </div>
    ${cards}
  </section>`;
}

function partScore() {
  const rows = SCORECARD.rows.map(r => `
    <div class="sc-row">
      <div class="sc-era">${r.era}</div>
      <div class="sc-mid">
        <div class="sc-claim">${r.claim}</div>
        <div class="sc-why">${r.why}</div>
        <div class="sc-lesson">${r.lesson}</div>
      </div>
      <div class="sc-v"><span class="vb ${r.verdict}">${r.verdict}</span></div>
    </div>`).join("");

  return `<section class="wrap" id="scorecard">
    <div class="part-head">
      <div class="part-n">Part VI</div>
      <h2>The Scorecard</h2>
      <p>${SCORECARD.intro}</p>
    </div>
    <div class="sc">${rows}</div>
    <div class="closing" style="margin-top:56px">
      <h3 style="font-size:1.9rem;margin-bottom:20px">${CLOSING.title}</h3>
      ${CLOSING.paras.map(p => `<p>${p}</p>`).join("")}
    </div>
    <div class="sources">
      <h4>On sourcing</h4>
      <p>Positions are drawn from public statements, published papers and on-record interviews through the 2026 landscape. Quantitative anchors — METR task-horizon measurements, hyperscaler capex guidance, datacenter power projections, funding rounds — are cited in-line at the point of use.</p>
      <p>No quotations are invented. Where a view is characterized rather than quoted, it is a characterization of a documented position, and every profile pairs the position with a specific instance of that person being wrong. Fast-moving facts carry their date; treat anything undated as needing a check before you rely on it.</p>
    </div>
  </section>`;
}

function nav() {
  return `<nav class="nav" id="nav">
    <div class="brand">
      <div class="brand-mark">Axiom / Perspective</div>
      <div class="brand-name">The Revolution Handbook</div>
      <div class="brand-sub">Thinking clearly about AI, from the positions of the people building it</div>
    </div>
    <div class="nav-sec">
      <div class="nav-h">Contents</div>
      <a href="#top"><span class="gl">◇</span>Opening</a>
      <a href="#minds"><span class="nn">I</span>The Minds</a>
      <a href="#faultlines"><span class="nn">II</span>Disagreement Map</a>
      <a href="#concepts"><span class="nn">III</span>Concepts</a>
      <a href="#systems"><span class="nn">IV</span>Physical Layer</a>
      <a href="#toolkit"><span class="nn">V</span>Critic's Toolkit</a>
      <a href="#scorecard"><span class="nn">VI</span>The Scorecard</a>
    </div>
    <div class="nav-sec">
      <div class="nav-h">The Minds</div>
      ${MINDS.filter(m => m.domain !== "adjacent").map(m => `<a href="#mind-${m.id}"><span class="gl" style="color:${m.color}">${m.glyph}</span>${m.name}</a>`).join("")}
    </div>
    <div class="nav-sec">
      <div class="nav-h">From Outside</div>
      ${MINDS.filter(m => m.domain === "adjacent").map(m => `<a href="#mind-${m.id}"><span class="gl" style="color:${m.color}">${m.glyph}</span>${m.name}</a>`).join("")}
    </div>
  </nav>`;
}

document.getElementById("app").innerHTML = `
  <button class="navtoggle" id="navtoggle">☰</button>
  <div class="shell">
    ${nav()}
    <main class="main">
      ${hero()}${partMinds()}${partFault()}${partConcepts()}${partSystems()}${partToolkit()}${partScore()}
    </main>
  </div>
  <button class="top" id="top" aria-label="Back to top">↑</button>`;

// mind card expand/collapse
document.querySelectorAll("[data-toggle]").forEach(el => {
  el.addEventListener("click", () => el.closest(".mind").classList.toggle("open"));
});

// concept filters
const filterBar = document.getElementById("cpt-filters");
filterBar.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  filterBar.querySelectorAll("button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  const f = b.dataset.f;
  document.querySelectorAll(".cpt").forEach(c => {
    c.style.display = (f === "all" || c.dataset.tag === f) ? "" : "none";
  });
});

// deep link to a mind opens it
function openHash() {
  const h = location.hash;
  if (h.startsWith("#mind-")) {
    const el = document.querySelector(h);
    if (el) el.classList.add("open");
  }
}
window.addEventListener("hashchange", openHash);
openHash();

// mobile nav
const navEl = document.getElementById("nav");
document.getElementById("navtoggle").addEventListener("click", () => navEl.classList.toggle("open"));
navEl.addEventListener("click", e => { if (e.target.tagName === "A") navEl.classList.remove("open"); });

// scroll spy + back to top
const topBtn = document.getElementById("top");
const secs = [...document.querySelectorAll("section[id]")];
const links = [...document.querySelectorAll('.nav a[href^="#"]')];
window.addEventListener("scroll", () => {
  topBtn.classList.toggle("show", window.scrollY > 700);
  const y = window.scrollY + 140;
  let cur = secs[0]?.id;
  for (const s of secs) if (s.offsetTop <= y) cur = s.id;
  links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur));
}, { passive: true });
topBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));


</script>
</body>
</html>
